[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "viventium-health"
version = "0.1.0"
description = "Raw, append-only health-source evidence for Viventium"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-FSL-1.1-ALv2-Future"
license-files = ["LICENSE"]
authors = [
  {name = "Project Viventium"},
]
keywords = ["health", "wearables", "whoop", "mcp", "viventium"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/ProjectViventium/Viventium-Health#readme"
Issues = "https://github.com/ProjectViventium/Viventium-Health/issues"
Repository = "https://github.com/ProjectViventium/Viventium-Health"

[project.scripts]
viventium-health = "viventium_health.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
